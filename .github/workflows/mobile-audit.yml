name: Audit SIAP - Browser Mobile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser testing
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Start local web server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/siap-http.log 2>&1 &
          sleep 2
      - name: Test 320 / 375 / 390 / 430 / 768 px
        run: node scripts/audit-mobile.mjs
      - name: Upload screenshots and test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siap-mobile-audit
          path: qa-artifacts/
          if-no-files-found: warn
